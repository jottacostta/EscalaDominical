<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0047BA">
<title>Escalas — Supermercados Guanabara</title>
<!-- Endereço antigo (com número de versão) ou que não existe mais: leva para o endereço fixo do app certo. -->
<script>
(function(){
  var p=location.pathname, base=p.indexOf('/EscalaDominical/')>=0?'/EscalaDominical/':'/';
  var destino=/encarregados/i.test(p)?'encarregados/':(/setores/i.test(p)?'setores/':'');
  if(destino) location.replace(base+destino);
  else document.addEventListener('DOMContentLoaded',function(){ document.getElementById('msg').hidden=false; });
})();
</script>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0047BA;color:#fff;font:600 16px system-ui,sans-serif;text-align:center;padding:20px}a{color:#FFCC00}</style>
</head>
<body><p>Abrindo a escala…</p><p id="msg" hidden>Este endereço não existe. Use o link da sua gestão:<br><a href="/EscalaDominical/setores/">Escala de Setores</a> · <a href="/EscalaDominical/encarregados/">Escala de Encarregados</a></p></body>
</html>
