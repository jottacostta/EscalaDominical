# Roda os testes automáticos (testes/rodar.js, dados fictícios) em todo Pull Request e em todo push no main.
# Não roda também no push do branch de trabalho: o Pull Request já cobre esse mesmo commit sem duplicação.
name: Testes

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: testes-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  testes:
    name: Playwright + Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar o Playwright e o Chromium
        id: instalar-playwright
        working-directory: testes
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Suíte rápida (3 meses de cada app)
        working-directory: testes
        run: npm test
      - name: Suíte completa (12 meses de cada app)
        if: steps.instalar-playwright.outcome == 'success' && !cancelled()
        working-directory: testes
        run: npm run test:completo
      - name: Bateria exploratória Gabriel — 100 perguntas (50 por app)
        if: steps.instalar-playwright.outcome == 'success' && !cancelled()
        working-directory: testes
        run: npm run test:gabriel-100
      - name: Guardar relatório da bateria Gabriel — 100 perguntas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-gabriel-100
          path: testes/relatorio-gabriel-100.json
          if-no-files-found: warn
          retention-days: 14
      - name: Guardar captura da lista manual (V230)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-setores-v230
          path: testes/screenshots/*.png
          if-no-files-found: ignore
          retention-days: 7
