# Roda os testes automáticos (testes/rodar.js, dados fictícios) em todo Pull Request, em todo push no main
# e nos branches do ChatGPT (chatgpt/…). Serve para os dois assistentes (Claude e ChatGPT/Codex):
# o resultado aparece no PR (aba Checks), verificável por qualquer um.
name: Testes

on:
  pull_request:
  push:
    branches: [main, "chatgpt/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes:
    name: Playwright + Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar o Playwright e o Chromium
        working-directory: testes
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Suíte rápida (3 meses de cada app)
        working-directory: testes
        run: npm test
      - name: Suíte completa (12 meses de cada app)
        working-directory: testes
        run: npm run test:completo
